name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议。请尽量说明问题背景、使用场景和你希望得到的结果。
  - type: textarea
    id: need
    attributes:
      label: 需求描述
      description: 你希望实现什么能力？解决什么问题？
      placeholder: 请描述要解决的问题，以及希望新增或改进的能力。
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么情境下需要这个功能？
      placeholder: 请描述真实的使用场景、目标用户或工作流。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果有想法，描述你认为可行的实现方式。
      placeholder: 可以写出接口、交互、数据结构或实现方向。
    validations:
      required: false
  - type: textarea
    id: theory
    attributes:
      label: 理论依据
      description: 如果涉及数术概念或推演规则，请注明出处（典籍、流派等）。
      placeholder: 请填写相关理论来源、典籍、流派或已有约定。
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 参考资料、相关 Issue、截图等。
      placeholder: 可以补充链接、图示、先前讨论或其他上下文。
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有议题，并确认这项建议尚未被提出
          required: true
