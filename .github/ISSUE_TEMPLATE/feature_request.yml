name: "功能或改进建议"
description: "提出范围明确的新能力或行为改进"
title: "[Feature]: "
labels:
  - "type: feature"
  - "status: needs triage"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        请优先描述问题、目标用户和可验证结果。

        尚未形成明确需求的方向讨论或跨仓库想法，请前往：
        https://github.com/orgs/matharts/discussions

  - type: textarea
    id: problem
    attributes:
      label: "需要解决的问题"
      description: "当前有什么限制、困难或未满足的需求？"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: "目标用户与场景"
      placeholder: |
        目标用户：
        使用场景：
        当前做法：
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "期望结果"
      description: "请描述完成后的行为和验收方式。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案与替代方案"
      description: "可以说明可能方案、已尝试的变通方式和主要取舍。"
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: "可能影响"
      options:
        - "不确定"
        - "仅内部实现"
        - "公共 API 或类型"
        - "配置或数据格式"
        - "用户可见行为或计算结果"
        - "兼容性或 Breaking Change"
        - "跨仓库或组织级流程"
    validations:
      required: true

  - type: textarea
    id: domain_basis
    attributes:
      label: "规则或资料依据"
      description: "涉及术语、历法、流派或计算规则时，请提供来源、适用范围和已知差异。"
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: "贡献意愿"
      options:
        - "我可以提交 Pull Request"
        - "我可以协助设计、测试或验证"
        - "我目前只能提供需求和反馈"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索已有 Issues 和 Discussions。"
          required: true
        - label: "我已区分事实、当前实现、建议和待验证内容。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
