name: "功能或改进建议"
description: "提出新能力、工作流改进或用户可见行为变更"
title: "[Feature]: "
labels:
  - "enhancement"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议。

        请优先描述需要解决的问题、目标用户和使用场景。

        尚未形成明确需求的方向讨论、理论讨论或跨仓库想法，更适合先提交到 MathArts Discussions：
        https://github.com/orgs/matharts/discussions

  - type: textarea
    id: problem
    attributes:
      label: "需要解决的问题"
      description: "当前有什么限制、困难或未满足的需求？请不要只描述希望增加的实现。"
      placeholder: "例如：使用者无法在不修改内部代码的情况下选择不同的规则配置。"
    validations:
      required: true

  - type: textarea
    id: users_and_scenario
    attributes:
      label: "目标用户和使用场景"
      description: "谁会使用这项能力？会在什么情况下使用？"
      placeholder: |
        目标用户：
        使用场景：
        当前工作方式：
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: "期望结果"
      description: "请描述完成后的用户体验、行为或可验证结果。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案"
      description: "可以说明可能的接口、工作流或实现方向。维护者可能选择不同方案。"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案"
      description: "请说明尝试过的变通方式，或考虑过但未采用的方案。"
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: "可能影响"
      description: "请选择最接近的影响范围。"
      options:
        - "不确定"
        - "仅内部实现"
        - "公共 API 或类型"
        - "配置或数据格式"
        - "用户可见行为或计算结果"
        - "兼容性或 Breaking Change"
        - "跨仓库或组织级流程"
    validations:
      required: true

  - type: textarea
    id: domain_basis
    attributes:
      label: "术语、规则或资料依据"
      description: "涉及数术术语、历法、流派、映射关系或计算规则时填写。"
      placeholder: |
        术语或规则：
        适用范围：
        资料来源：
        已知差异或争议：
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: "贡献意愿"
      description: "这不会影响建议是否被接受。"
      options:
        - "我可以提交 Pull Request"
        - "我可以协助设计、测试或验证"
        - "我目前只能提供需求和反馈"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: "补充信息"
      description: "可提供相关 Issue、Discussion、RFC、截图、示例或参考资料。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索已有 Issues 和 Discussions，并确认这不是重复建议。"
          required: true
        - label: "我已区分事实、当前实现、个人建议和待验证内容。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
