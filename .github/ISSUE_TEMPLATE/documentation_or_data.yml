name: "文档、术语或知识数据问题"
description: "报告文档缺失、术语歧义、来源问题或知识数据错误"
title: "[Docs/Data]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        此模板用于可以明确定位和修正的文档、术语或知识数据问题。

        开放式理论讨论、流派比较和尚未形成具体修改建议的问题，请优先前往 MathArts Discussions：
        https://github.com/orgs/matharts/discussions

  - type: dropdown
    id: issue_type
    attributes:
      label: "问题类型"
      options:
        - "文档缺失或不完整"
        - "文档与当前实现不一致"
        - "示例错误或无法运行"
        - "术语定义不清或不一致"
        - "引用、出处或归属问题"
        - "知识数据、映射表或常量错误"
        - "翻译或文字问题"
        - "其他"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "问题位置"
      description: "请提供文件路径、页面链接、符号名称、数据项或相关章节。"
      placeholder: "例如：docs/reference/calendar.md#day-boundary"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "问题说明"
      description: "请说明当前内容存在什么问题，以及它可能误导或阻塞哪些读者。"
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: "建议修改"
      description: "可以提供建议文字、结构、数据差异或修正方向。"
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: "来源和适用范围"
      description: "涉及术语、典籍、流派、历法、映射关系或知识数据时填写。"
      placeholder: |
        来源：
        适用流派或上下文：
        当前内容：
        建议内容：
        已知差异或争议：
    validations:
      required: false

  - type: dropdown
    id: behavior_impact
    attributes:
      label: "是否可能改变代码行为或计算结果"
      options:
        - "不会，仅修改文档表达"
        - "可能会，需要维护者确认"
        - "会，当前实现或数据可能存在错误"
        - "不确定"
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: "贡献意愿"
      options:
        - "我可以提交 Pull Request"
        - "我可以协助核对来源或验证结果"
        - "我目前只能报告问题"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: "补充材料"
      description: "可提供截图、对照结果、相关 Issue、Discussion、Specification 或其他资料。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索已有 Issues 和 Discussions，并确认这不是重复问题。"
          required: true
        - label: "我没有把未经确认的观点描述为已接受规范或普遍共识。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
