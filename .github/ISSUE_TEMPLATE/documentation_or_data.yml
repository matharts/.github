name: "文档、术语或知识数据问题"
description: "报告可定位的文档、来源、术语或数据问题"
title: "[Docs/Data]: "
labels:
  - "status: needs triage"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        此模板用于能够定位和修正的问题。

        开放式理论讨论、流派比较或尚无明确修改建议的问题，请前往：
        https://github.com/orgs/matharts/discussions

  - type: dropdown
    id: issue_type
    attributes:
      label: "问题类型"
      options:
        - "文档缺失或不完整"
        - "文档与实现不一致"
        - "示例错误"
        - "术语定义不清或不一致"
        - "引用、出处或归属问题"
        - "知识数据、映射或常量错误"
        - "翻译或文字问题"
        - "其他"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "问题位置"
      description: "请提供文件、页面、符号、数据项或章节。"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "当前内容与问题"
      description: "请引用当前内容，并说明它为什么不准确、不完整或不可用。"
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: "建议内容"
      description: "请提供期望文字、数据差异或修正方向。"
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: "来源与适用范围"
      description: "涉及术语、典籍、流派、历法或知识数据时，请提供可定位来源和已知差异。"
    validations:
      required: false

  - type: dropdown
    id: behavior_impact
    attributes:
      label: "是否可能改变行为或计算结果"
      options:
        - "不会，仅修改表达"
        - "可能，需要维护者确认"
        - "会，当前实现或数据可能错误"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: "补充材料"
      description: "可提供截图、对照结果或相关链接。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索已有 Issues 和 Discussions。"
          required: true
        - label: "我没有把未经确认的观点描述为已接受规范。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
