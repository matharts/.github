name: "Bug 报告"
description: "报告可复现的错误、缺陷或回归"
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs triage"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助 MathArts 改进项目。

        安全漏洞不得公开提交，请按照安全策略私密报告：
        https://github.com/matharts/.github/blob/main/SECURITY.md

  - type: input
    id: version
    attributes:
      label: "版本或提交"
      description: "请填写发布版本、Commit SHA 或分支。"
      placeholder: "例如：v0.4.1 或 abc1234"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "最小复现步骤"
      description: "请提供可以重复执行的最小步骤、代码、配置或输入。"
      placeholder: |
        1. 使用……
        2. 输入……
        3. 调用……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "请说明期望结果，以及依据是什么。"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
      description: "请提供实际结果和已脱敏的完整错误信息。"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "环境"
      description: "仅填写与复现有关的操作系统、运行时和依赖版本。"
      placeholder: |
        操作系统：
        运行时：
        相关依赖：
    validations:
      required: false

  - type: textarea
    id: domain_basis
    attributes:
      label: "规则或资料依据"
      description: "涉及术语、历法、流派或计算结果时，请提供来源和适用范围。"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "补充材料"
      description: "可提供截图、日志或相关链接。请删除凭证和个人数据。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索已有 Issues，并确认这不是重复报告。"
          required: true
        - label: "这不是需要私密报告的安全漏洞。"
          required: true
        - label: "我已删除凭证、个人数据和其他敏感信息。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
