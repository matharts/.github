name: Bug 报告
description: 报告一个错误或非预期行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有议题，确认问题尚未被报告。
  - type: textarea
    id: description
    attributes:
      label: 描述
      description: 简要描述遇到的问题。
      placeholder: 请说明你观察到的错误或异常行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出复现问题的步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望看到什么结果？
      placeholder: 请描述正确或预期的行为。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 请描述当前实际结果、报错或异常现象。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 15、Ubuntu 24.04、Windows 11
    validations:
      required: false
  - type: input
    id: runtime
    attributes:
      label: 运行时版本
      description: Node / Python / Rust 等运行时版本。
      placeholder: 例如 Node 22.3.0、Python 3.12.4、rustc 1.79.0
    validations:
      required: false
  - type: input
    id: project-version
    attributes:
      label: 项目版本或 Commit
      placeholder: 例如 v0.3.1 或 abc1234
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、日志、相关 Issue 链接等。如涉及数术推演结果错误，请注明理论出处。
      placeholder: 可以补充日志、截图链接、参考资料或上下文。
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有议题，并确认这不是重复报告
          required: true
        - label: 我愿意遵守本项目的行为准则
          required: true
