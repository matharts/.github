name: "Bug 报告"
description: "报告可以稳定复现的错误或非预期行为"
title: "[Bug]: "
labels:
  - "bug"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助 MathArts 改进项目。

        提交前请先搜索已有 Issues，确认问题尚未被报告。

        **安全漏洞不得在此公开提交。** 请按照 MathArts 的安全策略进行私密报告：
        https://github.com/matharts/.github/blob/main/SECURITY.md

  - type: textarea
    id: summary
    attributes:
      label: "问题摘要"
      description: "请简要说明发生了什么，以及它为什么是一个问题。"
      placeholder: "例如：在特定日期输入下，计算结果与项目文档定义不一致。"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "受影响版本"
      description: "请填写发布版本、软件包版本或 Commit SHA。"
      placeholder: "例如：v0.4.1、1.2.0 或 abc1234"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "请填写与复现有关的操作系统、运行时、浏览器、架构或依赖版本。"
      placeholder: |
        操作系统：
        运行时及版本：
        浏览器及版本：
        其他相关依赖：
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: "复现步骤"
      description: "请提供最小、完整且可以重复执行的步骤。"
      placeholder: |
        1. 安装……
        2. 使用输入……
        3. 调用……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: minimal_example
    attributes:
      label: "最小复现示例"
      description: "可以粘贴最小代码、配置或输入数据。请删除密钥和个人数据。"
      render: "text"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "请说明你期望得到的结果。"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
      description: "请说明实际结果，包括完整错误信息或可观察到的差异。"
    validations:
      required: true

  - type: textarea
    id: domain_context
    attributes:
      label: "规则、术语或资料依据"
      description: "仅当问题涉及历法、术语、流派、映射关系或数术计算结果时填写。"
      placeholder: |
        输入：
        当前结果：
        预期结果：
        采用的规则或流派：
        资料来源：
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "日志或补充材料"
      description: "可提供日志、截图、堆栈信息或相关链接。请删除敏感信息。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索已有 Issues，并确认这不是重复报告。"
          required: true
        - label: "这不是需要私密报告的安全漏洞。"
          required: true
        - label: "我已删除密钥、凭证、个人数据和其他敏感信息。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
