title: "[Q&A] "

body:
  - type: markdown
    attributes:
      value: |
        Q&A 用于使用方法、概念澄清和可以得到明确回答的问题。

        可复现的软件缺陷请提交到目标仓库；安全漏洞必须私密报告。

  - type: textarea
    id: question
    attributes:
      label: "问题"
      description: "请用一段话说明你希望得到什么答案。"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "背景与目标"
      description: "你正在使用哪个项目、版本和功能？想完成什么任务？"
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: "已经尝试的内容"
      description: "请提供查阅过的文档、尝试步骤和已脱敏的结果。"
    validations:
      required: false

  - type: textarea
    id: domain_basis
    attributes:
      label: "术语或资料背景"
      description: "涉及流派、历法或领域规则时，请说明采用的定义和来源。"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "提交确认"
      options:
        - label: "我已搜索现有文档和讨论。"
          required: true
        - label: "我已删除凭证、个人数据和其他敏感信息。"
          required: true
        - label: "我愿意遵守 MathArts 社区行为准则。"
          required: true
