name: Sync organization labels

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/sync-labels.yml"

  schedule:
    # 每周一 UTC 03:17 检查标签漂移。
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: sync-organization-labels
  cancel-in-progress: false

jobs:
  sync-labels:
    name: Sync labels to all repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels
        uses: srealmoreno/label-sync-action@v2
        with:
          token: ${{ secrets.LABEL_SYNC_TOKEN }}

          # 自动发现 MathArts 组织内的仓库。
          auto-discover-repos: true
          account-type: org
          owner: matharts

          # 不同步归档、禁用或 Fork 仓库。
          exclude-archived-repos: true
          exclude-disabled-repos: true
          exclude-forked-repos: true

          # 使用中央标签配置。
          config-file: ".github/labels.yml"

          # 保留各仓库自己的 area:*、package:* 等扩展标签。
          clean-labels: true
