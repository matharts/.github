name: Sync organization labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅预览变更，不实际修改标签"
        required: true
        type: boolean
        default: true

      repository:
        description: "只同步指定仓库；留空同步全部仓库"
        required: false
        type: string
        default: ""

  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/actions/sync-labels/**"
      - ".github/workflows/sync-labels.yml"

  schedule:
    # 每周一 UTC 03:17 检查并修复标签漂移。
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: sync-organization-labels
  cancel-in-progress: false

jobs:
  sync-labels:
    name: Synchronize organization labels
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout governance repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run MathArts label sync
        uses: ./.github/actions/sync-labels
        with:
          token: ${{ secrets.LABEL_SYNC_TOKEN }}
          owner: ${{ github.repository_owner }}
          config_file: ".github/labels.yml"

          dry_run: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.dry_run
                || false }}

          repository: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.repository
                || '' }}
