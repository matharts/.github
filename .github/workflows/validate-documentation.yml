name: Validate documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"

  workflow_dispatch:

  schedule:
    # 每周一 UTC 04:41 检查外部链接是否失效。
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-files:
    name: Validate community files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required community files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "SECURITY.md"
            "SUPPORT.md"
            "profile/README.md"
            ".github/pull_request_template.md"
          )

          for path in "${required_files[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "::error file=$path::Required community file is missing or empty."
              exit 1
            fi
          done

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: ".markdownlint-cli2.jsonc"
          globs: "**/*.md"

  links:
    name: Validate documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}"
            "./**/*.md"
          fail: true
          failIfEmpty: true
          jobSummary: true

      - name: Check forbidden URLs
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'https?://[^ )>]+:[^ )>]+@' . --include='*.md'; then
            echo "::error::Credentials in documentation URLs are forbidden."
            exit 1
          fi

          if grep -RInE '\[[^]]+\]\(http://' . --include='*.md'; then
            echo "::error::Plain HTTP documentation links are forbidden."
            exit 1
          fi
