name: Validate documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".markdownlint-cli2.jsonc"

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".markdownlint-cli2.jsonc"

  workflow_dispatch:

  schedule:
    # 每周一 UTC 04:41 检查外部链接是否失效。
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-files:
    name: Validate community files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required community files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "SECURITY.md"
            "SUPPORT.md"
            "profile/README.md"
            ".github/pull_request_template.md"
          )

          for path in "${required_files[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "::error file=$path::Required community file is missing or empty."
              exit 1
            fi
          done

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "yaml"

          files = Dir.glob(".github/**/*.{yml,yaml}").sort
          abort "No YAML files found under .github" if files.empty?

          files.each do |path|
            YAML.safe_load(
              File.read(path),
              permitted_classes: [],
              aliases: false,
              filename: path
            )
            puts "Validated #{path}"
          end
          RUBY

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: ".markdownlint-cli2.jsonc"
          globs: "**/*.md"

  local-links:
    name: Check repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}"
            "./**/*.md"
          fail: true
          failIfEmpty: true
          jobSummary: true

  external-links:
    name: Check external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --method head,get
            "./**/*.md"
          token: ${{ github.token }}
          fail: true
          failIfEmpty: true
          jobSummary: true
