name: Validate documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".github/scripts/**"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".github/scripts/**"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"

  workflow_dispatch:

  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-files:
    name: Validate community files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required community files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "SECURITY.md"
            "SUPPORT.md"
            "profile/README.md"
            ".github/pull_request_template.md"
          )
          for path in "${required_files[@]}"; do
            test -s "$path" || exit 1
          done

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: ".markdownlint-cli2.jsonc"
          globs: "**/*.md"

  references:
    name: Validate repository references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check repository references
        run: ruby .github/scripts/validate-document-references.rb

  links:
    name: Validate documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}"
            "./**/*.md"
          fail: true
          failIfEmpty: true
          jobSummary: true
