name: Validate documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".github/scripts/**"
      - "lychee.toml"

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - ".github/scripts/**"
      - "lychee.toml"

  workflow_dispatch:

  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-files:
    name: Validate community files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check required community files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "SECURITY.md"
            "SUPPORT.md"
            "profile/README.md"
            ".github/DISCUSSION_TEMPLATE/ideas.yml"
            ".github/DISCUSSION_TEMPLATE/q-a.yml"
            ".github/pull_request_template.md"
          )
          for path in "${required_files[@]}"; do
            test -s "$path" || exit 1
          done

  references:
    name: Validate repository references and governance scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout authoritative MathArts labels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: matharts/sync-labels-action
          ref: a00dfc35f02c9bb6151ca84c1f76a846892f7b9c
          path: .sync-labels-action
          persist-credentials: false

      - name: Check repository references
        run: ruby .github/scripts/validate-document-references.rb

      - name: Check Issue Form labels
        env:
          LABEL_CONFIG: .sync-labels-action/.github/labels.yml
        run: ruby .github/scripts/validate-issue-labels.rb

      - name: Check immutable GitHub Action references
        run: ruby .github/scripts/validate-action-pins.rb

  links:
    name: Validate documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}"
            "./**/*.md"
          fail: true
          failIfEmpty: true
          jobSummary: true
