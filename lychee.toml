# MathArts documentation link validation policy.

no_progress = true
max_redirects = 3
max_retries = 3
max_concurrency = 16
timeout = 30
retry_wait_time = 2

# Validate only successful responses.
accept = ["200..=299"]
require_https = true
insecure = false
method = "get"

# Validate anchor fragments and text fragments.
include_fragments = "full"

# Same-repository main-branch links are checked against the PR checkout by
# validate-document-references.rb. Excluding them here avoids false 404s for
# files introduced by the current pull request but not yet present on main.
exclude = [
  "^mailto:",
  "^javascript:",
  "^https://github\\.com/matharts/\\.github/(?:blob|tree)/(?:main|master)/"
]
